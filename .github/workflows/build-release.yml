name: edapack build-release

# Reusable workflow: resolve inputs -> change-gate -> build matrix -> publish.
# Each tool repo calls this from a thin ci.yml. The shared scripts are delivered
# via ivpm (edapack-common is an ivpm dependency of each tool, fetched into
# packages/edapack-common), and builds run in the STOCK manylinux images
# (quay.io/pypa/*) installing their deps at build time — no custom images.
# See https://edapack.github.io (Developer Guide → releasing).
on:
  workflow_call:
    inputs:
      package:
        description: "Package name, e.g. verilator-bin"
        required: true
        type: string
      images:
        description: 'Simple x86_64 docker matrix: JSON array of manylinux short-names, e.g. ["manylinux_2_28_x86_64"]'
        required: false
        type: string
        default: "[]"
      targets:
        description: >
          Rich build matrix (overrides `images`): JSON array of objects
          {name, runs-on, kind: docker|native, image?}. Use for aarch64
          (kind=docker on an arm runner) and macOS (kind=native). Example:
          [{"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
           {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
           {"name":"macos-arm64","runs-on":"macos-14","kind":"native"}]
        required: false
        type: string
        default: ""
      core_ref:
        description: "Override core input ref (tag/branch/sha)"
        required: false
        type: string
        default: ""
      input_overrides:
        description: "JSON map of dependency name -> ref"
        required: false
        type: string
        default: "{}"
      track:
        description: >
          dev = top-of-trunk snapshot (core.policy), pre-release, never moves
          `latest`. release = newest upstream release (core.release_policy),
          full release, moves `latest`. Both tracks resolve the release
          candidate and branch opposite ways on it, so at most one builds per
          run — see the Developer Guide (release tracks).
        required: false
        type: string
        default: dev
      force:
        description: "Build even if inputs unchanged"
        required: false
        type: boolean
        default: false
      prerelease:
        description: >
          Mark the release as prerelease. Applies to the dev track only; the
          release track is always a full release (a workflow_call input cannot
          tell "unset" from "default", so this is derived rather than honored
          there).
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------- #
  # resolve: fetch edapack-common (via ivpm), resolve input versions, and
  # decide whether a release is needed by diffing the last published manifest.
  # --------------------------------------------------------------------- #
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changed_summary: ${{ steps.gate.outputs.changed_summary }}
      targets: ${{ steps.targets.outputs.targets }}
      new_release: ${{ steps.newrel.outputs.new_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build matrix
        id: targets
        env:
          TARGETS_IN: ${{ inputs.targets }}
          IMAGES_IN: ${{ inputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          t = (os.environ.get("TARGETS_IN") or "").strip()
          if t and t != "[]":
              targets = json.loads(t)
          else:
              imgs = json.loads(os.environ.get("IMAGES_IN") or "[]")
              targets = [{"name": i, "runs-on": "ubuntu-latest",
                          "kind": "docker", "image": f"quay.io/pypa/{i}"} for i in imgs]
          assert targets, "no build targets: set `images` or `targets`"
          print("targets=" + json.dumps(targets))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
          test -f packages/edapack-common/scripts/resolve-inputs.py

      - name: Resolve inputs
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EC=packages/edapack-common
          overrides_args=()
          [ -n "${{ inputs.core_ref }}" ] && overrides_args+=(--core-ref "${{ inputs.core_ref }}")
          python3 "$EC/scripts/resolve-inputs.py" \
            --build-inputs build-inputs.yaml \
            --recipe-sha "$(git rev-parse HEAD)" \
            --track "${{ inputs.track }}" \
            --overrides-json '${{ inputs.input_overrides }}' \
            "${overrides_args[@]}" \
            --output candidate.json
          cat candidate.json

      # Both tracks ask the same question — "has upstream released something we
      # have not built?" — and branch opposite ways on the answer, so a week
      # that produces a release does not also produce a dev snapshot. The test
      # is a pure function of upstream tags + our published releases, needing no
      # job-to-job plumbing and no state carried between runs.
      - name: Detect new upstream release
        id: newrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rel_tag="$(python3 -c 'import json; c=json.load(open("candidate.json"))["release_candidate"]; print(c["tag"] if c else "")')"
          if [ -z "$rel_tag" ]; then
            echo "no release_policy declared -> dev track only"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$rel_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "upstream $rel_tag already released by us"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream $rel_tag is new"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=${rel_tag}" >> "$GITHUB_OUTPUT"

      # P3: `gh release download` with no tag pulls GitHub's *latest* release,
      # which excludes pre-releases — the dev track would diff against a
      # hand-promoted release rather than last week's build. Walk releases
      # newest-first instead and take the first manifest matching this track.
      - name: Fetch last release manifest for this track
        id: prev
        if: inputs.track == 'dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK: ${{ inputs.track }}
        run: |
          EC=packages/edapack-common
          previous=none
          tags=$(gh release list --repo "${{ github.repository }}" --limit 10 \
                   --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $tags; do
            rm -rf prev && mkdir -p prev
            gh release download "$tag" --repo "${{ github.repository }}" \
              --pattern manifest.json --dir prev >/dev/null 2>&1 || continue
            [ -f prev/manifest.json ] || continue
            found=$(python3 "$EC/scripts/gen-manifest.py" track \
                      --manifest prev/manifest.json --tag "$tag")
            if [ "$found" = "$TRACK" ]; then
              echo "previous manifest: $tag"
              previous=prev/manifest.json
              break
            fi
          done
          [ "$previous" = none ] && echo "no prior $TRACK release found"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Change gate
        id: gate
        env:
          NEW_RELEASE: ${{ steps.newrel.outputs.new_release }}
        run: |
          EC=packages/edapack-common
          if [ "${{ inputs.track }}" = release ]; then
            # The upstream tag *is* the identity on this track: build exactly
            # when upstream has a release we have not published. The inputs
            # digest is still recorded in the manifest, just not used as a gate.
            if [ "$NEW_RELEASE" = true ] || [ "${{ inputs.force }}" = "true" ]; then
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
            fi
            {
              echo "changed_summary<<EOF"
              echo "Upstream release ${{ steps.newrel.outputs.release_tag }}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "$NEW_RELEASE" = true ] && [ "${{ inputs.force }}" != "true" ]; then
            # A new upstream release exists: the release track is building it,
            # so skip the redundant snapshot of the same code.
            echo "standing down for release ${{ steps.newrel.outputs.release_tag }}"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "changed_summary<<EOF"
              echo "Superseded by release ${{ steps.newrel.outputs.release_tag }}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            pinned=""; [ -n "${{ inputs.core_ref }}" ] || [ "${{ inputs.input_overrides }}" != "{}" ] && pinned="--pinned"
            force="";  [ "${{ inputs.force }}" = "true" ] && force="--force"
            python3 "$EC/scripts/manifest-diff.py" \
              --candidate candidate.json \
              --previous "${{ steps.prev.outputs.previous }}" \
              --trigger "${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}" \
              $force $pinned \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Compute version
        id: version
        run: |
          core_ver="$(python3 -c 'import json; d=json.load(open("candidate.json")); print(next(i["version"] or "0" for i in d["inputs"] if i["role"]=="core"))')"
          if [ "${{ inputs.track }}" = release ]; then
            # Simple, matching upstream: 5.050 / v5.050, no build-id suffix.
            version="${core_ver}"
          else
            # run_id, not a date: two builds can land on the same day, and every
            # published dev tag to date uses the run id.
            version="${core_ver}.${{ github.run_id }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # Verilator-style upstreams publish tags but no GitHub Releases, so the
      # release body comes from their changelog at the built SHA. Soft-fails:
      # a changelog reformat must not block a release (exit 2 -> default notes).
      - name: Extract upstream release notes
        id: notes
        if: inputs.track == 'release' && steps.gate.outputs.build_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EC=packages/edapack-common
          # The changelog path rides along in candidate.json (core.release_notes),
          # so there is no second YAML parse here. Exit 2 = no notes available.
          if python3 "$EC/scripts/release-notes.py" \
               --candidate candidate.json \
               --package "${{ inputs.package }}" \
               --version "${{ steps.version.outputs.version }}" \
               --output release-notes.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "release notes unavailable; publishing with default notes"
          fi

      - name: Upload candidate
        if: steps.gate.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            candidate.json
            release-notes.md
          if-no-files-found: warn

  # --------------------------------------------------------------------- #
  # build: one job per target. Linux targets (kind=docker) `docker run` the
  # stock quay.io/pypa image (deps installed at build time) — on x86_64 (ubuntu-
  # latest) or aarch64 (an arm runner). macOS targets (kind=native) run build.sh
  # directly on the runner. We `docker run` rather than `container:` because
  # actions' node20 needs glibc >= 2.28 and would fail inside manylinux2014.
  # --------------------------------------------------------------------- #
  build:
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
          test -f packages/edapack-common/scripts/build-common.sh

      - uses: actions/download-artifact@v4
        with:
          name: candidate

      - name: Build (docker — Linux manylinux)
        if: matrix.target.kind == 'docker'
        env:
          EC_PACKAGE: ${{ inputs.package }}
          EC_VERSION: ${{ needs.resolve.outputs.version }}
          EC_TAG: ${{ needs.resolve.outputs.tag }}
          EC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}
          EC_IMAGE_NAME: ${{ matrix.target.name }}
          EC_TRACK: ${{ inputs.track }}
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src" \
            -e SRC_DIR=/src -e WORK_DIR=/tmp/ecwork -e OUT_DIR=/src/dist \
            -e EC_COMMON=/src/packages/edapack-common \
            -e EC_INSTALL_DEPS=1 \
            -e CANDIDATE_JSON=/src/candidate.json \
            -e EC_PACKAGE -e EC_VERSION -e EC_TAG -e EC_TRIGGER -e EC_IMAGE_NAME -e EC_TRACK \
            -e EC_RECIPE_SHA="$(git rev-parse HEAD)" \
            -e core_ref="${{ inputs.core_ref }}" \
            -e input_overrides='${{ inputs.input_overrides }}' \
            "${{ matrix.target.image }}" \
            bash /src/scripts/build.sh
          ls -l dist/

      - name: Provision macOS deps
        if: matrix.target.kind == 'native' && runner.os == 'macOS'
        run: |
          brew install autoconf automake flex bison cmake ninja help2man gmp mpfr || true
          pip3 install meson ninja --break-system-packages || pip3 install meson ninja || true

      - name: Build (native — macOS)
        if: matrix.target.kind == 'native'
        env:
          EC_PACKAGE: ${{ inputs.package }}
          EC_VERSION: ${{ needs.resolve.outputs.version }}
          EC_TAG: ${{ needs.resolve.outputs.tag }}
          EC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}
          EC_IMAGE_NAME: ${{ matrix.target.name }}
          EC_TRACK: ${{ inputs.track }}
          core_ref: ${{ inputs.core_ref }}
          input_overrides: ${{ inputs.input_overrides }}
        run: |
          mkdir -p dist
          export SRC_DIR="$PWD" WORK_DIR="$RUNNER_TEMP/ecwork" OUT_DIR="$PWD/dist"
          export EC_COMMON="$PWD/packages/edapack-common"
          export CANDIDATE_JSON="$PWD/candidate.json"
          export EC_RECIPE_SHA="$(git rev-parse HEAD)"
          # PATH for keg-only brew flex/bison
          export PATH="$(brew --prefix bison 2>/dev/null)/bin:$(brew --prefix flex 2>/dev/null)/bin:$PATH"
          bash scripts/build.sh
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.name }}
          path: dist/

  # --------------------------------------------------------------------- #
  # publish: merge per-platform manifests, create the release, upload assets.
  # --------------------------------------------------------------------- #
  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge manifests
        run: |
          manifests=$(find artifacts -name 'manifest-*.json' -print)
          python3 packages/edapack-common/scripts/gen-manifest.py merge \
            $(for m in $manifests; do echo --manifest "$m"; done) \
            --output manifest.json
          mkdir -p upload
          find artifacts -name '*.tar.gz' -exec cp {} upload/ \;
          find artifacts -name '*.sha256' -exec cp {} upload/ \;
          cp manifest.json upload/
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(mktemp)"
          upstream_notes=artifacts/candidate/release-notes.md
          if [ "${{ inputs.track }}" = release ] && [ -f "$upstream_notes" ]; then
            cp "$upstream_notes" "$notes"
          else
            {
              echo "Automated build of ${{ inputs.package }} ${{ needs.resolve.outputs.version }}."
              echo; echo "### Input changes since last release"; echo
              echo "${{ needs.resolve.outputs.changed_summary }}"
            } > "$notes"
          fi
          # The release track publishes a full release and takes `latest`; the
          # dev track is always a pre-release and must never move `latest`.
          if [ "${{ inputs.track }}" = release ]; then
            flags="--latest"
          else
            flags="--latest=false"
            [ "${{ inputs.prerelease }}" = "true" ] && flags="--prerelease --latest=false"
          fi
          gh release create "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.package }} ${{ needs.resolve.outputs.version }}" \
            --notes-file "$notes" $flags \
            upload/*
