name: edapack build-release

# Reusable workflow: resolve inputs -> change-gate -> build matrix -> publish.
# Each tool repo calls this from a thin ci.yml. The shared scripts are delivered
# via ivpm (edapack-common is an ivpm dependency of each tool, fetched into
# packages/edapack-common), and builds run in the STOCK manylinux images
# (quay.io/pypa/*) installing their deps at build time — no custom images.
# See https://edapack.github.io (Developer Guide → releasing).
on:
  workflow_call:
    inputs:
      package:
        description: "Package name, e.g. verilator-bin"
        required: true
        type: string
      images:
        description: 'Simple x86_64 docker matrix: JSON array of manylinux short-names, e.g. ["manylinux_2_28_x86_64"]'
        required: false
        type: string
        default: "[]"
      targets:
        description: >
          Rich build matrix (overrides `images`): JSON array of objects
          {name, runs-on, kind: docker|native, image?}. Use for aarch64
          (kind=docker on an arm runner) and macOS (kind=native). Example:
          [{"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
           {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
           {"name":"macos-arm64","runs-on":"macos-14","kind":"native"}]
        required: false
        type: string
        default: ""
      core_ref:
        description: "Override core input ref (tag/branch/sha)"
        required: false
        type: string
        default: ""
      input_overrides:
        description: "JSON map of dependency name -> ref"
        required: false
        type: string
        default: "{}"
      track:
        description: >
          dev = top-of-trunk snapshot (core.policy), pre-release, never moves
          `latest`. release = newest upstream release (core.release_policy),
          full release, moves `latest`. Both tracks resolve the release
          candidate and branch opposite ways on it, so at most one builds per
          run — see the Developer Guide (release tracks).
        required: false
        type: string
        default: dev
      force:
        description: "Build even if inputs unchanged"
        required: false
        type: boolean
        default: false
      prerelease:
        description: >
          Mark the release as prerelease. Applies to the dev track only; the
          release track is always a full release (a workflow_call input cannot
          tell "unset" from "default", so this is derived rather than honored
          there).
        required: false
        type: boolean
        default: true
      revision:
        description: >
          Release track only. Republish an upstream release we already
          published, as a PACKAGING revision: the tag becomes
          v<upstream>.<revision> (v0.59.0 -> v0.59.0.1). For shipping a fix to
          the package itself (a layout or consumer-contract bug) without
          waiting for upstream to release. A fourth component, never a bumped
          patch number: an invented v0.59.1 would collide with upstream's own
          v0.59.1 and the release gate would then skip it as already published.
          Use with core_ref pinned to the upstream tag being revised.
        required: false
        type: string
        default: ""
      revision_note:
        description: "Release track, with revision: what changed in the package, for the release body."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------- #
  # gate: the release master switch. ONE file, above both forges, decides who
  # is allowed to publish this repo:
  #     https://dvkit.org/.well-known/release-authority.json
  # It is generated from sync-policy.toml by `git-sync emit-release-authority`,
  # so GitHub and Forgejo cannot drift apart -- there is only one copy for them
  # to disagree about. The runner only READS it, over plain HTTPS with no
  # credential: a workflow file is public and editable by anyone who can push,
  # so a secret here would protect nothing.
  #
  # WHY A SEPARATE JOB. `if:` on a job cannot reference a step in its own job,
  # so the switch is resolved here and consumed via needs.gate.outputs.authority.
  # That requires `needs: gate` on the consuming job -- declared on `publish`
  # below. OMIT IT AND THE EXPRESSION IS AN EMPTY STRING: nothing publishes,
  # nothing goes red, and the repo quietly stops releasing. Three repos in this
  # estate had that bug.
  #
  # NAMING: this JOB is `gate`, matching the other 50-odd repos in the estate.
  # `resolve` separately has a STEP with `id: gate` (the input-change gate).
  # Different namespaces, and they are never referenced together: the step is
  # `steps.gate.*` inside `resolve`, this job is `needs.gate.*` from `publish`.
  # --------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # DECIDED 2026-08-30: fail CLOSED when a release could actually
            # happen. A release blocked by a dvkit.org outage is recoverable in
            # ten minutes; a release published twice from two forges is not,
            # and a GitHub Release tag can be deleted but the artifacts people
            # already downloaded cannot be recalled.
            #
            # For edapack "when a release could actually happen" is not a tag
            # (see the note on `publish` below) -- it is any event that is not
            # a push. A push never publishes here, so an unreachable switch on
            # a push is quiet.
            case "$GITHUB_EVENT_NAME" in
              push)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a push; nothing to release"
                exit 0 ;;
              *)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------- #
  # resolve: fetch edapack-common (via ivpm), resolve input versions, and
  # decide whether a release is needed by diffing the last published manifest.
  # --------------------------------------------------------------------- #
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changed_summary: ${{ steps.gate.outputs.changed_summary }}
      targets: ${{ steps.targets.outputs.targets }}
      new_release: ${{ steps.newrel.outputs.new_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build matrix
        id: targets
        env:
          TARGETS_IN: ${{ inputs.targets }}
          IMAGES_IN: ${{ inputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          t = (os.environ.get("TARGETS_IN") or "").strip()
          if t and t != "[]":
              targets = json.loads(t)
          else:
              imgs = json.loads(os.environ.get("IMAGES_IN") or "[]")
              targets = [{"name": i, "runs-on": "ubuntu-latest",
                          "kind": "docker", "image": f"quay.io/pypa/{i}"} for i in imgs]
          assert targets, "no build targets: set `images` or `targets`"
          print("targets=" + json.dumps(targets))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
          test -f packages/edapack-common/scripts/resolve-inputs.py

      - name: Resolve inputs
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EC=packages/edapack-common
          overrides_args=()
          [ -n "${{ inputs.core_ref }}" ] && overrides_args+=(--core-ref "${{ inputs.core_ref }}")
          python3 "$EC/scripts/resolve-inputs.py" \
            --build-inputs build-inputs.yaml \
            --recipe-sha "$(git rev-parse HEAD)" \
            --track "${{ inputs.track }}" \
            --overrides-json '${{ inputs.input_overrides }}' \
            "${overrides_args[@]}" \
            --output candidate.json
          cat candidate.json

      # Both tracks ask the same question — "has upstream released something we
      # have not built?" — and branch opposite ways on the answer, so a week
      # that produces a release does not also produce a dev snapshot. The test
      # is a pure function of upstream tags + our published releases, needing no
      # job-to-job plumbing and no state carried between runs.
      - name: Detect new upstream release
        id: newrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rel_tag="$(python3 -c 'import json; c=json.load(open("candidate.json"))["release_candidate"]; print(c["tag"] if c else "")')"
          if [ -z "$rel_tag" ]; then
            echo "no release_policy declared -> dev track only"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$rel_tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "upstream $rel_tag already released by us"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream $rel_tag is new"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=${rel_tag}" >> "$GITHUB_OUTPUT"

      # P3: `gh release download` with no tag pulls GitHub's *latest* release,
      # which excludes pre-releases — the dev track would diff against a
      # hand-promoted release rather than last week's build. Walk releases
      # newest-first instead and take the first manifest matching this track.
      # Runs on BOTH tracks. The dev track uses it as the change-gate baseline;
      # the release track uses only `previous_core_ref` (below), to tell
      # release-notes.py's compare mode where the last release left off.
      - name: Fetch last release manifest for this track
        id: prev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK: ${{ inputs.track }}
        run: |
          EC=packages/edapack-common
          previous=none
          tags=$(gh release list --repo "${{ github.repository }}" --limit 10 \
                   --json tagName -q '.[].tagName' 2>/dev/null || true)
          for tag in $tags; do
            rm -rf prev && mkdir -p prev
            gh release download "$tag" --repo "${{ github.repository }}" \
              --pattern manifest.json --dir prev >/dev/null 2>&1 || continue
            [ -f prev/manifest.json ] || continue
            found=$(python3 "$EC/scripts/gen-manifest.py" track \
                      --manifest prev/manifest.json --tag "$tag")
            if [ "$found" = "$TRACK" ]; then
              echo "previous manifest: $tag"
              previous=prev/manifest.json
              break
            fi
          done
          [ "$previous" = none ] && echo "no prior $TRACK release found"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      # The upstream ref the PREVIOUS release was built from. This is what
      # release-notes.py's compare mode needs, and it is NOT the previous git
      # tag of this repo: a tool repo's tag and its upstream's tag need not
      # agree (upstream `yosys-0.50` vs our `v0.50`). The manifest records the
      # upstream ref precisely so this question has an exact answer.
      - name: Previous upstream ref
        id: prevref
        run: |
          ref=""
          if [ -f "${{ steps.prev.outputs.previous }}" ]; then
            ref="$(python3 -c '
          import json, sys
          m = json.load(open(sys.argv[1]))
          print(next((i.get("ref", "") for i in m.get("inputs", [])
                      if i.get("role") == "core"), ""))
          ' "${{ steps.prev.outputs.previous }}")"
          fi
          [ -n "$ref" ] && echo "previous upstream ref: $ref" \
                        || echo "no previous upstream ref (first release?)"
          echo "previous_core_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Change gate
        id: gate
        env:
          NEW_RELEASE: ${{ steps.newrel.outputs.new_release }}
        run: |
          EC=packages/edapack-common
          if [ "${{ inputs.track }}" = release ]; then
            # The upstream tag *is* the identity on this track: build exactly
            # when upstream has a release we have not published. The inputs
            # digest is still recorded in the manifest, just not used as a gate.
            # A packaging revision is an explicit request to rebuild an upstream
            # release we HAVE published; if that revision's tag already exists,
            # the publish job's create step refuses it, which is the right end.
            if [ "$NEW_RELEASE" = true ] || [ "${{ inputs.force }}" = "true" ] \
               || [ -n "${{ inputs.revision }}" ]; then
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
            fi
            {
              echo "changed_summary<<EOF"
              echo "Upstream release ${{ steps.newrel.outputs.release_tag }}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "$NEW_RELEASE" = true ] && [ "${{ inputs.force }}" != "true" ]; then
            # A new upstream release exists: the release track is building it,
            # so skip the redundant snapshot of the same code.
            echo "standing down for release ${{ steps.newrel.outputs.release_tag }}"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "changed_summary<<EOF"
              echo "Superseded by release ${{ steps.newrel.outputs.release_tag }}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            pinned=""; [ -n "${{ inputs.core_ref }}" ] || [ "${{ inputs.input_overrides }}" != "{}" ] && pinned="--pinned"
            force="";  [ "${{ inputs.force }}" = "true" ] && force="--force"
            python3 "$EC/scripts/manifest-diff.py" \
              --candidate candidate.json \
              --previous "${{ steps.prev.outputs.previous }}" \
              --trigger "${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}" \
              $force $pinned \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Compute version
        id: version
        run: |
          core_ver="$(python3 -c 'import json; d=json.load(open("candidate.json")); print(next(i["version"] or "0" for i in d["inputs"] if i["role"]=="core"))')"
          if [ "${{ inputs.track }}" = release ]; then
            # Simple, matching upstream: 5.050 / v5.050, no build-id suffix.
            version="${core_ver}"
            revision="${{ inputs.revision }}"
            if [ -n "$revision" ]; then
              case "$revision" in
                *[!0-9]*) echo "::error::revision must be a positive integer, got '$revision'"; exit 1 ;;
              esac
              [ "$revision" -ge 1 ] || { echo "::error::revision must be >= 1"; exit 1; }
              version="${core_ver}.${revision}"
            fi
          else
            # run_id, not a date: two builds can land on the same day, and every
            # published dev tag to date uses the run id.
            version="${core_ver}.${{ github.run_id }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      # Where the release body comes from. Verilator-style upstreams publish
      # tags but no GitHub Releases, so it is their changelog at the built SHA.
      # Verible-style upstreams have neither a changelog nor a release body, so
      # `release_notes: gh-compare` instead lists the pull requests merged since
      # the previous release's upstream ref. Soft-fails either way: a changelog
      # reformat or an API hiccup must not block a release (exit 2 -> default
      # notes).
      - name: Extract upstream release notes
        id: notes
        if: inputs.track == 'release' && steps.gate.outputs.build_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free text, so it travels as an environment variable and is never
          # spliced into the script: `${{ }}` substitution happens before bash
          # parses, so a note containing a quote broke the step (the first
          # xlsynth-bin revision did exactly that) and a crafted one would run.
          REVISION_NOTE: ${{ inputs.revision_note }}
        run: |
          EC=packages/edapack-common
          # A packaging revision rebuilds an upstream ref we already shipped,
          # so the upstream-changes section would compare a ref with itself.
          # Say what the revision IS instead; a tool repo's notes hook can
          # still append (e.g. a behavior diff, which should come out empty).
          if [ -n "${{ inputs.revision }}" ]; then
            python3 - \
                "${{ inputs.package }}" "${{ steps.version.outputs.version }}" \
                "${{ inputs.revision }}" > release-notes.md <<'PY'
          import json, os, sys
          pkg, version, revision = sys.argv[1:4]
          core = next(i for i in json.load(open("candidate.json"))["inputs"]
                      if i["role"] == "core")
          repo = core["repo"].rstrip("/").replace(".git", "")
          ref = core["ref"]
          note = os.environ.get("REVISION_NOTE", "").strip()
          print("Automated build of {} {}.\n".format(pkg, version))
          print("Upstream: {}/releases/tag/{}\n".format(repo, ref))
          print("## Packaging revision\n")
          print("Revision {} of the `{}` repack. The upstream binaries are the "
                "same ones `{}` shipped; only the package changed.".format(
                    revision, ref, ref))
          if note:
              print("\n" + note)
          PY
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          # The changelog path (or the gh-compare sentinel) rides along in
          # candidate.json (core.release_notes), so there is no second YAML
          # parse here. Exit 2 = no notes available.
          elif python3 "$EC/scripts/release-notes.py" \
               --candidate candidate.json \
               --package "${{ inputs.package }}" \
               --version "${{ steps.version.outputs.version }}" \
               --previous-ref "${{ steps.prevref.outputs.previous_core_ref }}" \
               --output release-notes.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "release notes unavailable; publishing with default notes"
          fi

      - name: Upload candidate
        if: steps.gate.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            candidate.json
            release-notes.md
          if-no-files-found: warn

  # --------------------------------------------------------------------- #
  # build: one job per target. Linux targets (kind=docker) `docker run` the
  # stock quay.io/pypa image (deps installed at build time) — on x86_64 (ubuntu-
  # latest) or aarch64 (an arm runner). macOS targets (kind=native) run build.sh
  # directly on the runner. We `docker run` rather than `container:` because
  # actions' node20 needs glibc >= 2.28 and would fail inside manylinux2014.
  # --------------------------------------------------------------------- #
  build:
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
          test -f packages/edapack-common/scripts/build-common.sh

      - uses: actions/download-artifact@v4
        with:
          name: candidate

      - name: Build (docker — Linux manylinux)
        if: matrix.target.kind == 'docker'
        env:
          EC_PACKAGE: ${{ inputs.package }}
          EC_VERSION: ${{ needs.resolve.outputs.version }}
          EC_TAG: ${{ needs.resolve.outputs.tag }}
          EC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}
          EC_IMAGE_NAME: ${{ matrix.target.name }}
          EC_TRACK: ${{ inputs.track }}
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src" \
            -e SRC_DIR=/src -e WORK_DIR=/tmp/ecwork -e OUT_DIR=/src/dist \
            -e EC_COMMON=/src/packages/edapack-common \
            -e EC_INSTALL_DEPS=1 \
            -e CANDIDATE_JSON=/src/candidate.json \
            -e EC_PACKAGE -e EC_VERSION -e EC_TAG -e EC_TRIGGER -e EC_IMAGE_NAME -e EC_TRACK \
            -e EC_RECIPE_SHA="$(git rev-parse HEAD)" \
            -e core_ref="${{ inputs.core_ref }}" \
            -e input_overrides='${{ inputs.input_overrides }}' \
            "${{ matrix.target.image }}" \
            bash /src/scripts/build.sh
          ls -l dist/

      - name: Provision macOS deps
        if: matrix.target.kind == 'native' && runner.os == 'macOS'
        run: |
          brew install autoconf automake flex bison cmake ninja help2man gmp mpfr || true
          pip3 install meson ninja --break-system-packages || pip3 install meson ninja || true

      - name: Build (native — macOS)
        if: matrix.target.kind == 'native'
        env:
          EC_PACKAGE: ${{ inputs.package }}
          EC_VERSION: ${{ needs.resolve.outputs.version }}
          EC_TAG: ${{ needs.resolve.outputs.tag }}
          EC_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || (github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push') }}
          EC_IMAGE_NAME: ${{ matrix.target.name }}
          EC_TRACK: ${{ inputs.track }}
          core_ref: ${{ inputs.core_ref }}
          input_overrides: ${{ inputs.input_overrides }}
        run: |
          mkdir -p dist
          export SRC_DIR="$PWD" WORK_DIR="$RUNNER_TEMP/ecwork" OUT_DIR="$PWD/dist"
          export EC_COMMON="$PWD/packages/edapack-common"
          export CANDIDATE_JSON="$PWD/candidate.json"
          export EC_RECIPE_SHA="$(git rev-parse HEAD)"
          # flex/bison are keg-only, and macOS ships a flex far too old for
          # Verilator. PATH alone is not enough: configure probes $FLEX/$LEX and
          # $BISON/$YACC, and silently falls back to the checked-in pregenerated
          # lexer when it does not find a usable flex — which then fails to
          # compile against the current V3LexerBase. Point every variable at the
          # brew copies, and give the linker/preprocessor libfl explicitly.
          brew_flex="$(brew --prefix flex 2>/dev/null)"
          brew_bison="$(brew --prefix bison 2>/dev/null)"
          export PATH="$brew_bison/bin:$brew_flex/bin:$PATH"
          export FLEX="$brew_flex/bin/flex" LEX="$brew_flex/bin/flex"
          export BISON="$brew_bison/bin/bison" YACC="$brew_bison/bin/bison"
          export LDFLAGS="-L$brew_flex/lib${LDFLAGS:+ $LDFLAGS}"
          export CPPFLAGS="-I$brew_flex/include${CPPFLAGS:+ $CPPFLAGS}"
          "$FLEX" --version && "$BISON" --version | head -1
          bash scripts/build.sh
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.name }}
          path: dist/

  # --------------------------------------------------------------------- #
  # publish: merge per-platform manifests, create the release, upload assets.
  # --------------------------------------------------------------------- #
  # --------------------------------------------------------------------- #
  # publish: create the GitHub Release. THREE conditions, and each one is load-
  # bearing for a different reason.
  #
  #   build_needed == 'true'      the original change gate: upstream moved, or
  #                               someone passed force.
  #
  #   github.event_name != 'push' SYNC SAFETY, added 2026-08-31 when edapack
  #                               entered the Forgejo <-> GitHub mirror. This
  #                               repo's history now moves between two forges on
  #                               a 5-minute cron, and `git-sync` produces
  #                               exactly one kind of event: a push. Without
  #                               this clause A SYNC CYCLE IS A RELEASE TRIGGER
  #                               -- manifest-diff.py says so in its own words,
  #                               "trigger is push -> build (CI always builds
  #                               pushes)" -- and a mirror operation must never
  #                               be a publishing operation.
  #
  #                               DELIBERATE DEVIATION from adding-orgs.md
  #                               §E2.2, which requires publish jobs to be gated
  #                               on a `v*` tag and nothing else. That rule is
  #                               written for repos where a human pushes a tag
  #                               and the tag IS the version. Here the tag is
  #                               computed by `resolve` and created BY this job
  #                               -- it is the output of a release, not its
  #                               trigger -- so tag-gating a job whose purpose
  #                               is to create the tag is not a stricter rule,
  #                               it is an unsatisfiable one. What §E2.2 exists
  #                               to protect is the property on the line above,
  #                               and this clause delivers it exactly.
  #
  #                               `schedule` and `workflow_dispatch` still
  #                               publish. Neither is something a mirror
  #                               performs.
  #
  #                               COST: a recipe commit no longer produces a
  #                               dev-track pre-release; the next scheduled run
  #                               does. The build still runs on push, which is
  #                               the whole value of push CI here.
  #
  #   authority == 'github'       so that with the same cron on both forges,
  #                               only one of them publishes. SKIPS rather than
  #                               fails when the switch names Forgejo: a
  #                               deliberate handover must not look like a
  #                               broken pipeline.
  # --------------------------------------------------------------------- #
  publish:
    needs: [gate, resolve, build]
    if: >-
      needs.resolve.outputs.build_needed == 'true' &&
      github.event_name != 'push' &&
      needs.gate.outputs.authority == 'github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch edapack-common via ivpm
        run: |
          pip install ivpm
          ivpm update -a --skip-py-install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge manifests
        run: |
          manifests=$(find artifacts -name 'manifest-*.json' -print)
          python3 packages/edapack-common/scripts/gen-manifest.py merge \
            $(for m in $manifests; do echo --manifest "$m"; done) \
            --output manifest.json
          mkdir -p upload
          find artifacts -name '*.tar.gz' -exec cp {} upload/ \;
          find artifacts -name '*.sha256' -exec cp {} upload/ \;
          cp manifest.json upload/

      # Optional per-tool addition to the release body. This is the only place
      # in the pipeline where the BUILT ARTIFACTS and their checksums exist at
      # once, which is what makes it worth a hook: a tool repo can say things
      # about the release that can only be derived from the binaries it just
      # produced (verible-bin diffs the shipped lint rules and formatter flags
      # against the previous release, so the notes state behavior changes
      # rather than asserting them).
      #
      # Contract: scripts/release-notes-hook.sh <artifacts-dir> <upload-dir>,
      # markdown on stdout, appended to the body. Soft-fails on purpose -- a
      # broken hook must not block a release that is otherwise ready.
      - name: Tool-repo release-notes hook
        id: hook
        if: hashFiles('scripts/release-notes-hook.sh') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC_PACKAGE: ${{ inputs.package }}
          EC_VERSION: ${{ needs.resolve.outputs.version }}
          EC_TAG: ${{ needs.resolve.outputs.tag }}
          EC_TRACK: ${{ inputs.track }}
          EC_REPO: ${{ github.repository }}
        run: |
          bash scripts/release-notes-hook.sh artifacts upload > notes-extra.md
          echo "--- hook output ---"; cat notes-extra.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(mktemp)"
          upstream_notes=artifacts/candidate/release-notes.md
          if [ "${{ inputs.track }}" = release ] && [ -f "$upstream_notes" ]; then
            cp "$upstream_notes" "$notes"
          else
            {
              echo "Automated build of ${{ inputs.package }} ${{ needs.resolve.outputs.version }}."
              echo; echo "### Input changes since last release"; echo
              echo "${{ needs.resolve.outputs.changed_summary }}"
            } > "$notes"
          fi
          # `continue-on-error` above leaves a partial file behind on failure,
          # so test for content rather than existence.
          if [ -s notes-extra.md ]; then
            { echo; cat notes-extra.md; } >> "$notes"
          fi
          # The release track publishes a full release and takes `latest`. A dev
          # build that opts out of prerelease is a full release too, so it takes
          # `latest` as well -- single-track repos have no release track to hold
          # that pointer, and leaving it behind strands it on a stale release.
          # A dev build that *is* a prerelease must never move `latest`.
          if [ "${{ inputs.track }}" = release ]; then
            flags="--latest"
          elif [ "${{ inputs.prerelease }}" = "true" ]; then
            flags="--prerelease --latest=false"
          else
            flags="--latest"
          fi
          gh release create "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.package }} ${{ needs.resolve.outputs.version }}" \
            --notes-file "$notes" $flags \
            upload/*
